readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "streamlit>=1.40,<2",
    "plotly>=5.24,<7",
    "yfinance>=0.2.50,<2",
    "keras>=3.8,<4",
    "tensorflow>=2.18,<2.22",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
]
